<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seed · Entrena en casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16131f; --card:#221d33; --card2:#2d2745; --line:#3a3355;
  --text:#fff6ea; --muted:#a99fc4; --accent:#ff7a3d; --lime:#c8f542;
  --pink:#ff5fa2; --sky:#5ec8ff; --gold:#ffd84d; --r:22px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--text)}
.screen{padding:calc(var(--top) + 14px) 16px calc(96px + var(--bot));max-width:560px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,.04)}
.card h3{font-size:18px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;background:var(--accent);color:#1a1424;font-weight:700;font-size:17px;width:100%;box-shadow:0 6px 0 #b8481a;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8481a}
.btn.lime{background:var(--lime);box-shadow:0 6px 0 #8fb01a}
.btn.lime:active{box-shadow:0 2px 0 #8fb01a}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none}
.btn.ghost:active{transform:scale(.98)}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px;width:auto}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:14px;background:var(--card2);border:2px solid transparent;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.chip.on{border-color:var(--lime);background:#2f3a2a;color:#f4ffd0}
.chip.warn.on{border-color:var(--pink);background:#3d2438;color:#ffe3f0}
.lbl{display:block;font-weight:700;margin:16px 0 8px}
.txt{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--card2);border:2px solid transparent;outline:0}
.txt:focus{border-color:var(--sky)}
textarea.txt{padding:12px 14px;min-height:80px;resize:vertical}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr h1{font-size:26px;font-weight:800}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.dot.off{background:#ffb84d}.dot.err{background:var(--pink)}
.hero{display:flex;align-items:flex-end;gap:6px;margin:12px 0 14px}
.bubble{position:relative;background:var(--card2);padding:12px 14px;border-radius:18px 18px 18px 4px;font-weight:500;flex:1;margin-bottom:34px}
.bubble:before{content:"";position:absolute;left:-8px;bottom:0;width:14px;height:14px;background:var(--card2);clip-path:polygon(100% 0,100% 100%,0 100%)}
.mascot{flex:none;line-height:0}
.mascot svg{width:var(--s);height:auto;overflow:visible}
.mascot.idle svg{animation:idle 2.6s ease-in-out infinite;transform-origin:50% 100%}
.mascot.bounce svg{animation:bounce .65s ease-in-out infinite;transform-origin:50% 100%}
.mascot .eyes{animation:blink 4.2s infinite;transform-origin:100px 100px}
@keyframes idle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97) translateY(2px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.xpbar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px}
.today{background:linear-gradient(160deg,#3a2a5c,#2a2142);border:1px solid #4d3c7a}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.exlist{display:flex;flex-direction:column;gap:2px;margin:10px 0 14px}
.exi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.exi:last-child{border:0}
.exi .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.exi .nm{flex:1;min-width:0}
.exi .nm b{display:block;font-weight:700;font-size:15px}
.exi .nm span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:12px;color:var(--muted)}
.wd i{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:12px;background:var(--card2);margin-top:4px;font-style:normal;font-size:16px}
.wd.done i{background:var(--lime);color:#1a1424}
.wd.today i{outline:2px solid var(--accent)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tpl{background:var(--card);border-radius:20px;padding:14px;text-align:left;min-height:118px;display:flex;flex-direction:column;gap:4px;border:1px solid rgba(255,255,255,.04)}
.tpl .e{font-size:28px}
.tpl b{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.15}
.tpl span{font-size:12px;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(22,19,31,.94);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:8px 8px calc(8px + var(--bot));border-top:1px solid var(--line);z-index:5}
.nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:14px;min-height:52px}
.nav button span{font-size:22px;line-height:1}
.nav button.on{color:var(--lime)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.bars div.cur i{background:var(--lime)}
.hist{border-bottom:1px solid rgba(255,255,255,.06);padding:10px 0}
.hist:last-child{border:0}
.spark{width:90px;height:30px}
.back{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-weight:700;color:var(--muted)}
.step-dots{display:flex;gap:6px;margin:8px 0 16px}
.step-dots i{flex:1;height:6px;border-radius:9px;background:var(--card2)}
.step-dots i.on{background:var(--lime)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.stepper button{width:56px;height:56px;border-radius:18px;background:var(--card2);font-size:28px;font-weight:700}
.stepper div{min-width:96px;text-align:center}
.stepper b{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-size:36px;display:block;line-height:1}
.stepper span{font-size:12px;color:var(--muted)}
#run{position:fixed;inset:0;z-index:20;display:none;background:radial-gradient(120% 80% at 50% 0%,#3b2a63 0%,#16131f 60%);overflow-y:auto}
#run.on{display:block}
.rwrap{min-height:100%;display:flex;flex-direction:column;padding:calc(var(--top) + 12px) 18px calc(18px + var(--bot));max-width:560px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .3s}
.rbody{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:16px}
.phase{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.exicon{width:96px;height:96px;border-radius:30px;background:var(--card2);display:grid;place-items:center;font-size:48px}
.rbody h1{font-size:30px;font-weight:800;line-height:1.1}
.cue{color:#e6dcf7;max-width:420px;margin:0}
.target{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-size:22px;font-weight:800;color:var(--gold)}
.rlinks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.rlinks button{min-height:44px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px;font-weight:700}
.ring{position:relative;width:230px;height:230px;margin:6px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-size:76px;font-weight:800}
.ring .num small{display:block;font-size:14px;color:var(--muted);font-family:'DM Sans';font-weight:500;margin-top:-12px}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:8px}
.rate button{min-height:84px;border-radius:20px;background:var(--card2);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px}
.rate button span{font-size:30px}
.dlg{position:fixed;inset:0;background:rgba(10,8,16,.7);display:grid;place-items:center;padding:20px;z-index:30}
.dlg>div{background:var(--card);border-radius:24px;padding:20px;max-width:380px;width:100%}
.dlg h3{font-size:22px;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards;z-index:25;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--bot));transform:translate(-50%,20px);background:var(--lime);color:#1a1424;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;z-index:40;max-width:88%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.evo div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}.evo div.lock .mascot{filter:brightness(0) opacity(.3)}.evo b{font-size:12px}.evo span{font-size:10px;color:var(--muted);line-height:1.15}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mt{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}.mt span{font-size:12px;color:var(--muted);display:block}.mt b{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-size:19px;display:block;margin:2px 0}.mt b i{font-size:11px;font-style:normal;color:var(--muted)}.mt small{font-size:10px;color:var(--muted);line-height:1.15;display:block}
.buds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.bud{background:var(--card2);border-radius:18px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;text-align:center}.bud.on{border-color:var(--lime);background:#2f3a2a}.bud b{font-size:14px}.bud span{font-size:11px;color:var(--muted);line-height:1.15}
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 16px;border-radius:14px;background:var(--card2);font-weight:700;border:2px solid transparent}.acc:active{border-color:var(--sky)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function ago(k){if(!k)return'';const n=daysBetween(k,dateKey(new Date()));return n<=0?'hoy':n===1?'ayer':'hace '+n+' días'}
const clone=o=>JSON.parse(JSON.stringify(o));

/* ============ datos ============ */
const EQUIP=[['mancuernas','Mancuernas','🏋️'],['bandas','Bandas elásticas','🎗️'],['kettlebell','Kettlebell / pesa rusa','🔔'],['silla','Silla o sofá firme','🪑'],['escalon','Escalón o step','🪜'],['barra','Barra de dominadas','🔩'],['mochila','Mochila con peso','🎒'],['rueda','Rueda abdominal','🛞'],['soportes','Soportes para flexiones','🤲'],['miniband','Mini bandas de loop (cortas)','⭕'],['tubo','Banda en 8 con asas','➰'],['cuerda','Cuerda de saltar','⏩'],['agarre','Agarre de mano (hand grip)','✊']];
const LIMITS=[['rodilla','Rodillas'],['espalda','Espalda baja'],['hombro','Hombros'],['muñeca','Muñecas'],['cuello','Cuello'],['tobillo','Tobillos'],['cadera','Caderas'],['impacto','Sin saltos ni ruido']];
const GOALS=[['general','Estar en forma','✨'],['fuerza','Ganar fuerza','💪'],['resist','Más resistencia','🔥'],['movil','Moverme sin dolor','🌀']];
const LEVELS=[[1,'Empezando'],[2,'Con base'],[3,'Avanzada/o']];
const ICON={mov:'🌀',est:'🧘',sent:'🦵',bis:'🍑',emp:'💪',tir:'🪢',core:'🎯',card:'🔥'};
const PHASE={warm:'Calentamiento',main:'Circuito',cool:'Enfriamiento'};
const WT=['mancuernas','kettlebell','mochila'];
const MINS=[10,15,20,30,45,60];
const DAYS=[1,2,3,4,5,6,7];

const X=[];const EX={};
const E=(id,name,pat,req,lvl,avoid,type,cue,alt,o)=>{const e=Object.assign({id,name,pat,req,lvl,avoid,type,cue,alt:alt||null},o||{});X.push(e);EX[id]=e};
/* movilidad */
E('m-gato','Gato-vaca','mov',[],1,['muñeca','rodilla'],'time','En cuatro apoyos, arquea y redondea la espalda suave al ritmo de tu respiración.');
E('m-cadera','Círculos de cadera','mov',[],1,[],'time','De pie, manos en la cintura, dibuja círculos grandes y lentos con la pelvis.');
E('m-torac','Rotación de tronco','mov',[],1,[],'time','De pie, brazos cruzados al pecho. Gira el tronco a cada lado sin mover las caderas.');
E('m-brazos','Círculos de brazos','mov',[],1,['hombro'],'time','Brazos abiertos, círculos amplios hacia adelante y luego hacia atrás.');
E('m-marcha','Marcha en el lugar','mov',[],1,[],'time','Sube las rodillas a ritmo cómodo y balancea los brazos.');
E('m-apertura','Sentadilla de apertura','mov',[],1,['rodilla'],'time','Baja en sentadilla amplia, abre las rodillas con los codos y sube lento.');
E('m-tobillo','Movilidad de tobillos','mov',[],1,[],'time','Con apoyo de una pared, dibuja círculos con la punta del pie. Cambia de pie a mitad de tiempo.');
E('m-cuello','Giros suaves de cuello','mov',[],1,['cuello'],'time','Mueve la cabeza lento: oreja al hombro a cada lado. Sin forzar.');
/* estiramientos */
E('e-flexor','Estiramiento de cadera','est',[],1,['rodilla'],'time','Una rodilla en el suelo (sobre una toalla), empuja la cadera hacia adelante suave. Cambia de lado a mitad.');
E('e-isquios','Estiramiento de piernas','est',[],1,['espalda'],'time','Sentada/o, una pierna estirada, inclínate desde la cadera con la espalda larga.');
E('e-pecho','Estiramiento de pecho','est',[],1,['hombro'],'time','Antebrazo en el marco de una puerta, gira el cuerpo suave hacia el lado contrario.');
E('e-nino','Postura del niño','est',[],1,['rodilla'],'time','Siéntate sobre los talones y estira los brazos al frente. Respira profundo.');
E('e-gemelo','Estiramiento de pantorrillas','est',[],1,[],'time','Manos en la pared, una pierna atrás con el talón en el suelo. Cambia a mitad de tiempo.');
E('e-cuello','Estiramiento lateral de cuello','est',[],1,['cuello'],'time','Sentada/o, inclina la oreja hacia el hombro con una mano suave de apoyo. Sin tirar.');
E('e-torsion','Torsión tumbada','est',[],1,[],'time','Boca arriba, lleva las rodillas a un lado y mira al lado contrario. Respira lento.');
/* sentadilla */
E('sent-silla','Sentadilla a la silla','sent',['silla'],1,[],'reps','Siéntate hacia atrás hasta tocar la silla y levántate empujando con los talones.');
E('sent-peso','Sentadilla','sent',[],1,['rodilla'],'reps','Pies al ancho de hombros, baja la cadera atrás y abajo. Rodillas siguen la línea de los pies.','sent-silla');
E('sent-pared','Sentadilla en la pared','sent',[],1,['rodilla'],'time','Espalda apoyada en la pared, baja hasta donde estés cómoda/o y sostén.','sent-silla',{secs:30});
E('sent-copa','Sentadilla copa con mancuerna','sent',['mancuernas'],2,['rodilla'],'reps','Sostén la mancuerna al pecho, codos abajo. Baja controlado y sube firme.','sent-silla');
E('sent-kb','Sentadilla copa con kettlebell','sent',['kettlebell'],2,['rodilla'],'reps','Kettlebell al pecho, espalda larga. Baja profundo sin que se despeguen los talones.','sent-silla');
E('sent-mochila','Sentadilla con mochila','sent',['mochila'],1,['rodilla'],'reps','Mochila cargada contra el pecho. Baja y sube con control.','sent-silla');
E('zanc','Zancada hacia atrás','sent',[],2,['rodilla','tobillo'],'reps','Da un paso largo atrás y baja la rodilla casi al suelo. Alterna piernas.','sent-silla',{side:true});
E('zanc-m','Zancada con mancuernas','sent',['mancuernas'],3,['rodilla','tobillo'],'reps','Mancuernas a los lados, paso largo atrás, torso erguido.','zanc',{side:true});
E('escalon','Subida al escalón','sent',['escalon'],2,['rodilla'],'reps','Sube con todo el pie apoyado y baja lento. Cambia de pierna a mitad.','sent-silla',{side:true});
E('bulgara','Sentadilla búlgara','sent',['silla'],3,['rodilla','tobillo','cadera'],'reps','Pie de atrás sobre la silla, baja recto. Tronco firme.','zanc',{side:true});
/* bisagra */
E('puente','Puente de glúteos','bis',[],1,[],'reps','Tumbada/o, pies cerca de la cadera. Sube la pelvis apretando glúteos y baja lento.');
E('puente-m','Puente con mancuerna','bis',['mancuernas'],2,[],'reps','Mancuerna sobre la pelvis. Sube apretando glúteos y sostén 1 segundo arriba.');

/* ============ lógica de rutinas ============ */
function okEx(e,p){const eq=new Set(p.equip||[]);if(eq.has('tubo'))eq.add('bandas');return e.req.every(r=>eq.has(r))&&!e.avoid.some(a=>(p.limits||[]).includes(a))&&!(p.flagged||[]).includes(e.id)}
function pool(pat,p,maxL){return X.filter(e=>e.pat===pat&&e.lvl<=maxL&&okEx(e,p))}
const usesW=e=>e.req.some(r=>WT.includes(r));
function mkStep(e,phase,sets,p){
  const time=e.type==='time';
  const base={fuerza:10,resist:15,movil:10,general:12}[p.goal]||12;
  const reps=time?0:Math.max(6,base-(p.level===1?2:0));
  return {id:e.id,phase,sets,reps,secs:e.secs||40,rest:phase==='main'?(p.goal==='fuerza'?45:30):0};
}
function stepSecs(s){const e=EX[s.id];const w=e.type==='time'?s.secs:40;return s.phase==='main'?s.sets*(w+s.rest):w+10}
function routineSecs(steps){return steps.reduce((a,s)=>a+stepSecs(s),0)}
function buildRoutine(tid,minutes,p,seed){
  const T=TPL[tid];const rng=mulberry32(seed);const maxL=p.level||1;const used=new Set();
  const pick=pat=>{
    let a=pool(pat,p,maxL);if(!a.length)a=pool(pat,p,3);
    a=a.filter(e=>!used.has(e.id));if(!a.length)return null;
    const sc=e=>rng()+(p.goal==='fuerza'&&e.req.length?.6:0);
    a.sort((x,y)=>sc(y)-sc(x));used.add(a[0].id);return a[0];
  };
  const steps=[];
  if(T.mob){
    const secs=minutes>=20?60:40;
    const n=Math.max(4,Math.min(40,Math.round(minutes*60/(secs+8))));
    const nm=Math.ceil(n*.55),ne=n-nm;
    const pickR=pat=>{let e=pick(pat);if(!e){used.clear();e=pick(pat)}return e};
    for(let i=0;i<nm;i++){const e=pickR('mov');if(e){const st=mkStep(e,'warm',1,p);st.secs=secs;steps.push(st)}}
    for(let i=0;i<ne;i++){const e=pickR('est');if(e){const st=mkStep(e,'cool',1,p);st.secs=secs;steps.push(st)}}
    return {tid,name:T.n,minutes,steps};
  }
  const wn=minutes>=30?3:2;
  for(let i=0;i<wn;i++){const e=pick('mov');if(e)steps.push(mkStep(e,'warm',1,p))}
  const sets=(minutes<15||(p.level===1&&minutes<30))?2:(minutes>=40&&p.level>=2?4:3);
  const rest=p.goal==='fuerza'?45:30;
  const budget=minutes*60-wn*2*50;
  const n=Math.max(2,Math.min(minutes>=50?15:12,Math.round(budget/(sets*(40+rest)))));
  for(let i=0;i<n;i++){const e=pick(T.slots[i%T.slots.length]);if(e)steps.push(mkStep(e,'main',sets,p))}
  for(let i=0;i<wn;i++){const e=pick('est');if(e)steps.push(mkStep(e,'cool',1,p))}
  return {tid,name:T.n,minutes,steps};
}
function todayTpl(p){
  const d=new Date().getDay();
  const plans={
    movil:['mov','core','mov','full','mov','lower','mov'],
    resist:['mov','cardio','full','core','cardio','upper','mov'],
    fuerza:['mov','lower','upper','mov','full','core','mov'],
    general:['mov','full','lower','mov','upper','cardio','core']
  };
  return (plans[p.goal]||plans.general)[d];
}
function swapCandidate(stepId,steps,p,rng){
  const cur=EX[stepId];const inUse=new Set(steps.map(s=>s.id));
  let a=pool(cur.pat,p,p.level||1).filter(e=>!inUse.has(e.id));
  if(!a.length)a=pool(cur.pat,p,3).filter(e=>!inUse.has(e.id));
  if(!a.length)return null;return a[Math.floor(rng()*a.length)];
}

  const d=(S.profile&&S.profile.days)||3;
  const f=d<=3?1:3/d;
  return Math.max(5,Math.round((10+eff+2*count)*f));

function stats(){
  const ses=S.sessions;const keys=[...new Set(ses.map(s=>s.date))].sort().reverse();
  const today=dateKey(new Date());let streak=0;
  if(keys.length&&daysBetween(keys[0],today)<=2){streak=1;for(let i=1;i<keys.length;i++){if(daysBetween(keys[i],keys[i-1])<=2)streak++;else break}}
  const ws=dateKey(weekStart(new Date()));
  const weekCount=ses.filter(s=>s.date>=ws).length;
  const xp=ses.reduce((a,s)=>a+(s.xp||0),0);
  const li=lvlInfo(xp);return {streak,weekCount,xp,lvl:li.lvl,xpCur:li.cur,xpNext:li.next,minutes:ses.reduce((a,s)=>a+(s.minutes||0),0),total:ses.length,last:keys[0]||''};
}
function weeklyCounts(n){
  const out=[];const w0=weekStart(new Date());
  for(let k=n-1;k>=0;k--){
    const a=new Date(w0);a.setDate(a.getDate()-7*k);const b=new Date(a);b.setDate(b.getDate()+6);
    const ka=dateKey(a),kb=dateKey(b);
    out.push({label:pad(a.getDate())+'/'+pad(a.getMonth()+1),n:S.sessions.filter(s=>s.date>=ka&&s.date<=kb).length,cur:k===0});
  }
  return out;
}
function exProgress(){
  const m={};
  [...S.sessions].reverse().forEach(s=>(s.ex||[]).forEach(e=>{
    const k=Math.max(0,...(e.sets||[]).map(x=>x.k||0));
    if(k>0)(m[e.id]=m[e.id]||[]).push(k);
  }));
  return Object.entries(m).map(([id,a])=>({id,a})).filter(x=>EX[x.id]).sort((x,y)=>y.a.length-x.a.length).slice(0,6);
}

async function rpc(fn,body){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:CFG.key},CFG.key.startsWith('sb_')?{}:{Authorization:'Bearer '+CFG.key}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+' '+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}

function cloudOp(op,path,data){
  if(!cloud())return;
  PQ=PQ.filter(q=>!(q.code===S.code&&q.path===path));
  PQ.push({code:S.code,op,path,data:data===undefined?null:data});qSave();flush();
}
async function flush(){
  if(FLUSHING||!CFG.url)return;FLUSHING=true;
  try{
    while(PQ.length){
      const q=PQ[0];
      if(q.op==='put')await rpc('seed_put',{p_code:q.code,p_path:q.path,p_data:q.data});
      else await rpc('seed_del',{p_code:q.code,p_path:q.path});
      PQ.shift();qSave();
    }
    if(S.sync==='error'){S.sync='cloud';syncUpdate()}
  }catch(e){if(S.sync!=='error'){S.sync='error';syncUpdate()}}
  FLUSHING=false;
}
function syncUpdate(){const el=document.querySelector('.sync');if(el)el.outerHTML=syncHTML()}
function derive(){
  const pre='p/'+S.uid+'/';
  S.profile=R[pre+'profile']||null;
  const sv=Object.keys(R).filter(k=>k.startsWith(pre+'s/')).map(k=>R[k]).sort((a,b)=>b.ts-a.ts);
  const mv=Object.keys(R).filter(k=>k.startsWith(pre+'m/')).map(k=>R[k]).sort((a,b)=>b.ts-a.ts);
  S.sessions=sv.slice(0,120);S.measures=mv.slice(0,120);
  S.team=Object.keys(R).filter(k=>k.startsWith('team/')).map(k=>Object.assign({id:k.slice(5)},R[k]));
}
function applyRows(rows){
  let n=0;
  for(const r of rows||[]){
    if(r.upd>SINCE)SINCE=r.upd;
    if(r.data===null||r.data===undefined)delete R[r.path];else R[r.path]=r.data;n++;
  }
  return n;
}
async function pullOnce(){
  const rows=await rpc('seed_pull',{p_code:S.code,p_since:SINCE});
  return applyRows(rows);
}
function loadLocalIntoR(){
  const l=lsLoad();R={};
  if(l.profile)R[pP()]=l.profile;
  (l.sessions||[]).forEach(x=>R[pS(x.id)]=x);
  (l.measures||[]).forEach(x=>R[pM(x.id)]=x);
}
async function startCloud(){
  qLoad();loadLocalIntoR();R=Object.assign({},R);SINCE=0;
  const hadCache=!!R[pP()];
  try{
    await flush();
    await pullOnce();
    S.sync=PQ.length?'error':'cloud';
  }catch(e){
    S.sync='error';
    if(!hadCache){S.profile=undefined;toast('No pude conectar con la nube. Reintento en unos segundos.');render();setTimeout(startCloud,6000);return}
  }
  derive();S.today=null;lsSave();
  render();
  startPoll();
}
function startPoll(){
  stopPoll();
  const tick=async()=>{
    if(document.hidden||!cloud())return;
    try{
      await flush();
      const n=await pullOnce();
      if(S.sync==='error'&&!PQ.length){S.sync='cloud';syncUpdate()}
      if(n){derive();lsSave();if(!(S.edit||S.wiz||S.view==='measure'||S.view==='preview'))render(true)}
    }catch(e){if(S.sync!=='error'){S.sync='error';syncUpdate()}}
  };
  POLL=setInterval(tick,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
}
function stopPoll(){if(POLL){clearInterval(POLL);POLL=null}}

async function init(){
  render();
  if(!CFG.url){
    S.uid='local';S.sync='local';
    loadLocalIntoR();derive();render();return;
  }
  const a=accLoad();
  if(a.code&&a.uid){S.code=a.code;S.uid=a.uid;await startCloud();return}
  S.login={step:'code',code:'',people:[],err:'',busy:false};S.sync='off';render();
}
function saveProfile(p){
  S.today=null;R[pP()]=p;derive();lsSave();
  cloudOp('put',pP(),p);
  pushTeam();
}
function addSession(s){
  R[pS(s.id)]=s;derive();lsSave();
  cloudOp('put',pS(s.id),s);
  pushTeam();
}
function addMeasure(v,dk){
  const today=dateKey(new Date());dk=dk||today;
  const ts=dk===today?Date.now():new Date(dk+'T12:00:00').getTime();
  const m=Object.assign({id:'m'+Date.now(),ts,date:dk},v);
  R[pM(m.id)]=m;derive();lsSave();
  cloudOp('put',pM(m.id),m);
}
function delMeasure(id){
  delete R[pM(id)];derive();lsSave();
  cloudOp('del',pM(id));
}
function pushTeam(){
  if(!cloud()||!S.profile)return;
  const st=stats();
  const t={name:S.profile.name,buddy:S.profile.buddy||'brio',streak:st.streak,wk:st.weekCount,total:st.total,last:st.last,lvl:st.lvl,upd:Date.now()};
  R['team/'+S.uid]=t;S.team=Object.keys(R).filter(k=>k.startsWith('team/')).map(k=>Object.assign({id:k.slice(5)},R[k]));
  cloudOp('put','team/'+S.uid,t);
}

const A={
  async lCode(){

const CIRC=2*Math.PI*90;

function audioInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.12))}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
function startRun(steps,name){
  if(!steps||!steps.length)return;
  S.run={name,steps:clone(steps),i:0,set:1,phase:'ready',logs:[],startTs:Date.now(),reps:12,kg:0,end:0,total:0,msg:say('ready'),confirm:false,lvlBefore:stats().lvl};
  initStep();audioInit();document.body.classList.add('noscroll');renderRun();
  clearInterval(TK);TK=setInterval(tick,200);
}
function initStep(){
  const R=S.run,st=R.steps[R.i],e=EX[st.id];
  R.reps=st.reps||12;R.kg=usesW(e)?suggestKg(st.id):0;
  if(!R.logs[R.i])R.logs[R.i]={id:st.id,sets:[],rate:null};
  else R.logs[R.i].id=st.id;
}
function tick(){
  const R=S.run;if(!R||!(R.phase==='work'||R.phase==='rest'))return;
  const rem=Math.max(0,(R.end-Date.now())/1000),c=Math.ceil(rem);
  const t=$('#tm');if(t&&t.textContent!==String(c)){t.textContent=c;if(c<=3&&c>0)beep(660,.08)}
  const ring=$('#ringp');if(ring)ring.style.strokeDashoffset=String(CIRC*(1-rem/R.total));
  if(rem<=0){beep(988,.25);buzz();if(R.phase==='work')A.rWorkDone();else A.rRestDone()}
}
function doneSet(){
  const R=S.run,st=R.steps[R.i],e=EX[st.id];
  const rec={};if(e.type==='time')rec.s=st.secs;else rec.r=R.reps;if(usesW(e)&&R.kg>0)rec.k=R.kg;
  R.logs[R.i].sets.push(rec);
  if(st.phase!=='main'){nextStep();return}
  if(R.set<st.sets){R.phase='rest';R.total=st.rest;R.end=Date.now()+st.rest*1000;R.msg=say('rest');renderRun();return}
  R.phase='fb';renderRun();
}
function nextStep(){
  const R=S.run;R.i++;
  if(R.i>=R.steps.length){finishRun();return}
  R.set=1;R.phase='ready';R.msg=say('ready');initStep();renderRun();
}
function flagCurrent(afterSets){
  const R=S.run,st=R.steps[R.i];
  const p=clone(S.profile);p.flagged=p.flagged||[];if(!p.flagged.includes(st.id))p.flagged.push(st.id);
  R.logs[R.i].pain=true;
  const e=EX[st.id];
  let c=e.alt&&EX[e.alt]&&okEx(EX[e.alt],p)&&!R.steps.some(s=>s.id===e.alt)?EX[e.alt]:swapCandidate(st.id,R.steps,p,Math.random);
  saveProfile(p);
  if(afterSets){R.msg=say('pain');toast('Lo evitaré en tus próximas rutinas 💛');nextStep();return}
  if(c){R.steps[R.i]=mkStep(c,st.phase,st.sets,p);R.set=1;R.logs[R.i]={id:c.id,sets:[],rate:null,pain:false};initStep();R.msg=say('pain')}
  else{R.logs[R.i].skip=true;toast('Lo evitaré en tus próximas rutinas 💛');nextStep();return}
  renderRun();
}
function finishRun(){
  const R=S.run;clearInterval(TK);
  const done=R.logs.filter(l=>l&&l.sets&&l.sets.length);
  const minutes=Math.max(1,Math.round((Date.now()-R.startTs)/60000));
  if(!done.length){closeRun();return}
  const xp=xpFor(minutes,done.length);
  const s={id:'s'+Date.now(),ts:Date.now(),date:dateKey(new Date()),name:R.name,minutes,xp,
    ex:done.map(l=>({id:l.id,sets:l.sets,rate:l.rate||'',pain:!!l.pain}))};
  addSession(s);
  R.phase='done';R.xp=xp;R.minutes=minutes;R.count=done.length;R.msg=say('done');
  renderRun();
}
function closeRun(){
  clearInterval(TK);S.run=null;document.body.classList.remove('noscroll');
  $('#run').className='';$('#run').innerHTML='';GREET=null;S.today=null;render();
}
function ringHTML(R,label){
  const rem=Math.max(0,Math.ceil((R.end-Date.now())/1000));
  return `<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/><circle id="ringp" cx="100" cy="100" r="90" fill="none" stroke="${R.phase==='rest'?'#5ec8ff':'#c8f542'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(1-rem/R.total)}"/></svg><div class="num"><div><span id="tm">${rem}</span><small>${label}</small></div></div></div>`;
}
function renderRun(){
  const R=S.run,el=$('#run');if(!R){el.className='';el.innerHTML='';return}
  el.className='on';
  if(R.phase==='done'){
    const st=stats();const lvlUp=st.lvl>R.lvlBefore;
    const partner=S.team.filter(t=>t.id!==S.uid)[0];
    el.innerHTML=`<div class="rwrap"><div class="rbody" style="justify-content:center">${mascot('win',st.lvl,190)}<h1>${R.msg}</h1>
      <div class="row" style="flex-wrap:wrap;justify-content:center"><span class="pill">⏱ ${R.minutes} min</span><span class="pill">🏋️ ${R.count} ejercicios</span><span class="pill">⭐ +${R.xp} XP</span><span class="pill">🔥 racha ${st.streak}</span></div>
      ${lvlUp?`<div class="card" style="width:100%"><b>¡Subiste al nivel ${st.lvl}!</b><div class="muted small">${B().n} evoluciona: ahora es ${lvlName(st.lvl)}. Desbloqueaste: <b style="color:var(--gold)">${UNLOCK[st.lvl-1]}</b></div></div>`:''}
      ${partner?`<p class="muted small">${esc(partner.name||'Tu compañero/a')} entrenó ${ago(partner.last)||'hace poco'}. ¡Sigan así!</p>`:''}
      <button class="btn lime" style="margin-top:12px" onclick="A.rClose()">Volver al inicio</button></div></div>`;
    confetti();return;
  }
  const st=R.steps[R.i],e=EX[st.id],n=R.steps.length,time=e.type==='time';
  const top=`<div class="rtop"><button class="ib" onclick="A.rExit()" aria-label="Salir">✕</button><div class="bar"><i style="width:${Math.round(R.i/n*100)}%"></i></div><span class="muted small">${R.i+1}/${n}</span></div>`;
  let body='';
  const mini=`<div class="hero" style="margin:0;align-items:center">${mascot(R.phase==='rest'?'rest':'happy',stats().lvl,72)}<div class="bubble" style="margin-bottom:0;font-size:14px">${R.msg||''}</div></div>`;
  if(R.phase==='ready'){
    const tg=(st.sets>1?`Serie ${R.set} de ${st.sets} · `:'')+(time?st.secs+' s':st.reps+' reps')+(e.side?' por lado':'');
    body=`<div class="rbody"><div class="phase">${PHASE[st.phase]}</div><div class="exicon">${ICON[e.pat]}</div><h1>${esc(e.name)}</h1><p class="cue">${esc(e.cue)}</p><div class="target">${tg}</div>
      ${!time?`<div class="stepper"><button onclick="A.rAdj('reps',-1)">−</button><div><b id="vreps">${R.reps}</b><span>reps hechas</span></div><button onclick="A.rAdj('reps',1)">+</button></div>`:''}
      ${usesW(e)?`<div class="stepper"><button onclick="A.rAdj('kg',-0.5)">−</button><div><b id="vkg">${R.kg}</b><span>kg</span></div><button onclick="A.rAdj('kg',0.5)">+</button></div>`:''}
      <div style="width:100%;margin-top:8px">${time?`<button class="btn lime" onclick="A.rStart()">▶ Empezar (${st.secs} s)</button>`:`<button class="btn lime" onclick="A.rSetDone()">✓ Serie hecha</button>`}</div>
      <div class="rlinks"><button onclick="A.rSwap()">↻ Cambiar</button><button onclick="A.rPain()">🤕 Me molesta</button><button onclick="A.rSkip()">Saltar</button></div>
      ${mini}</div>`;
  }else if(R.phase==='work'){
    body=`<div class="rbody"><div class="phase">${PHASE[st.phase]}${st.sets>1?' · serie '+R.set+'/'+st.sets:''}</div><h1>${esc(e.name)}</h1>${ringHTML(R,'segundos')}<p class="cue">${esc(e.cue)}</p><div style="width:100%"><button class="btn ghost" onclick="A.rEarly()">Terminar antes</button></div></div>`;
  }else if(R.phase==='rest'){
    const nx=R.set<st.sets?e:EX[(R.steps[R.i+1]||st).id];
    body=`<div class="rbody"><div class="phase">Descanso</div>${ringHTML(R,'respira')}<p class="muted">Sigue: <b style="color:var(--text)">${esc(nx.name)}</b> · serie ${R.set+1} de ${st.sets}</p>
      <div class="row" style="width:100%"><button class="btn ghost grow" onclick="A.rMore()">+15 s</button><button class="btn lime grow" onclick="A.rSkipRest()">Ya estoy listo/a</button></div>${mini}</div>`;
  }else if(R.phase==='fb'){
    body=`<div class="rbody"><div class="phase">${esc(e.name)}</div><h1>¿Cómo se sintió?</h1><p class="muted">Así ajusto tu próxima rutina.</p>
      <div class="rate"><button onclick="A.rFb('facil')"><span>😄</span>Fácil</button><button onclick="A.rFb('justo')"><span>💪</span>Justo</button><button onclick="A.rFb('duro')"><span>😮‍💨</span>Duro</button><button onclick="A.rFb('dolor')"><span>🤕</span>Me molestó</button></div></div>`;
  }
  const dlg=R.confirm?`<div class="dlg"><div><h3>¿Terminamos por hoy?</h3><p class="muted">Puedes guardar lo que alcanzaste a hacer.</p><div class="stack"><button class="btn lime" onclick="A.rSaveQuit()">Guardar y terminar</button><button class="btn ghost" onclick="A.rStay()">Seguir entrenando</button><button class="btn ghost" onclick="A.rQuit()">Salir sin guardar</button></div></div></div>`:'';
  el.innerHTML=`<div class="rwrap">${top}${body}</div>${dlg}`;
}
function confetti(){
  const cols=['#ff7a3d','#c8f542','#ff5fa2','#5ec8ff','#ffd84d'];
  for(let i=0;i<36;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}
}
init();
</script>
</body>
</html>
